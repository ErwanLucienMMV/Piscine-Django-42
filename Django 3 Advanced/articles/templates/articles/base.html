<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Articles</title></head>
<body>
<header><h1>Articles <small>Share your writings</small></h1></header>
<nav aria-label="Main navigation">
<a href="{% url 'home' %}">Home</a> <a href="{% url 'articles' %}">Last Articles</a>
{% if user.is_authenticated %}
<a href="{% url 'favourites' %}">Favourites</a> <a href="{% url 'publications' %}">Publications</a>
<span>Logged as {{ user.username }}</span>
<form method="post" action="{% url 'logout' %}">{% csrf_token %}<button type="submit">Logout</button></form>
{% else %}<a href="{% url 'login' %}">Login</a>{% endif %}
</nav>
<main>{% block content %}{% endblock %}</main>
</body></html>
