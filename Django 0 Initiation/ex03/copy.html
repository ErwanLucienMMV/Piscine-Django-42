<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Frontend and backend skills</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <ul>
        <li>
            <h2>Frontend</h2>
            <p data-value="80" style="width: 80%;"><label for="html5">HTML5</label></p>
            <progress id="html5" class="html5" value="80" max="100">80%</progress>
            <p data-value="60" style="width: 60%;"><label for="css3">CSS3</label></p>
            <progress id="css3" class="css3" value="60" max="100">60%</progress>
            <p data-value="50" style="width: 50%;"><label for="jquery">jQuery</label></p>
            <progress id="jquery" class="jquery" value="50" max="100">50%</progress>
        </li>
        <li>
            <h2>Backend</h2>
            <p data-value="75" style="width: 75%;"><label for="python">Python</label></p>
            <progress id="python" class="python" value="75" max="100">75%</progress>
            <p data-value="65" style="width: 65%;"><label for="php">PHP</label></p>
            <progress id="php" class="php" value="65" max="100">65%</progress>
            <p data-value="35" style="width: 35%;"><label for="node-js">Node.js</label></p>
            <progress id="node-js" class="node-js" value="35" max="100">35%</progress>
        </li>
    </ul>
</body>
</html>
